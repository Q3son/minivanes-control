name: Respaldo de la base de datos

on:
  schedule:
    - cron: "0 8 * * *" # todos los días a las 3:00 a. m. hora de Lima
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    name: Exportar y cifrar la base de datos
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLAVE_RESPALDO: ${{ secrets.CLAVE_RESPALDO }}
    steps:
      - name: Verificar secretos
        id: secretos
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$CLAVE_RESPALDO" ]; then
            echo "Faltan los secretos SUPABASE_DB_URL o CLAVE_RESPALDO; se omite el respaldo."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Exportar el esquema public con pg_dump 17
        if: steps.secretos.outputs.listo == 'true'
        run: |
          docker run --rm -e URL="$SUPABASE_DB_URL" -v "$PWD:/salida" postgres:17 \
            sh -c 'pg_dump "$URL" --schema=public --no-owner --no-privileges --format=custom --file=/salida/respaldo.dump'
          ls -lh respaldo.dump

      - name: Cifrar (el repositorio es público)
        if: steps.secretos.outputs.listo == 'true'
        run: |
          fecha=$(TZ=America/Lima date +%F)
          gpg --batch --yes --pinentry-mode loopback --passphrase "$CLAVE_RESPALDO" \
            --symmetric --cipher-algo AES256 --output "respaldo-$fecha.dump.gpg" respaldo.dump
          shred -u respaldo.dump
          echo "ARCHIVO=respaldo-$fecha.dump.gpg" >> "$GITHUB_ENV"
          # El de los domingos se guarda 90 días; los demás, 14.
          if [ "$(TZ=America/Lima date +%u)" = "7" ]; then dias=90; else dias=14; fi
          echo "DIAS=$dias" >> "$GITHUB_ENV"

      - name: Guardar el respaldo cifrado
        if: steps.secretos.outputs.listo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVO }}
          path: ${{ env.ARCHIVO }}
          retention-days: ${{ env.DIAS }}
          if-no-files-found: error
